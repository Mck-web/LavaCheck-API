<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>LavaCheck - Check-in</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body { background-color: #f8f9fa; }
        .form-container { max-width: 500px; margin: 40px auto; background: white; padding: 30px; border-radius: 8px; box-shadow: 0 0 10px rgba(0,0,0,0.1); }
        .logo-title { color: #dc3545; font-weight: bold; text-align: center; margin-bottom: 30px; }
        .btn-whatsapp { background-color: #25D366; color: white; width: 100%; font-weight: bold; }
        .btn-whatsapp:hover { background-color: #128C7E; color: white; }
    </style>
</head>
<body>

<div class="container form-container">
    <h3 class="logo-title">🚗 LavaCheck</h3>
    <h5 class="text-center mb-4">Novo Check-in</h5>
    
    <form id="checkinForm">
        <div class="mb-3">
            <label class="form-label">Placa do Veículo</label>
            <input type="text" class="form-control" id="placa" placeholder="ABC-1234" required>
        </div>
        <div class="mb-3">
            <label class="form-label">Modelo / Cor</label>
            <input type="text" class="form-control" id="modelo" placeholder="ex: HB20 branco" required>
        </div>
        <div class="mb-3">
            <label class="form-label">Nome do Cliente</label>
            <input type="text" class="form-control" id="cliente" required>
        </div>
        <div class="mb-3">
            <label class="form-label">WhatsApp</label>
            <input type="text" class="form-control" id="whatsapp" placeholder="699999999" required>
        </div>
        <div class="mb-4">
            <label class="form-label">Avarias Prévias</label>
            <textarea class="form-control" id="avarias" rows="2" placeholder="arranhões, amassados..."></textarea>
        </div>
        <button type="submit" class="btn btn-primary w-100 mb-3">Gerar Ticket</button>
    </form>

    <div id="sucessoDiv" class="alert alert-success d-none text-center">
        <h5 class="alert-heading">Sucesso!</h5>
        <p id="ticketMsg" class="mb-3"></p>
        <button class="btn btn-whatsapp">
            <i class="bi bi-whatsapp"></i> Enviar Comprovante no WhatsApp
        </button>
    </div>
</div>

<script>
    document.getElementById('checkinForm').addEventListener('submit', async function(e) {
        e.preventDefault();
        
        const dados = {
            placa: document.getElementById('placa').value.toUpperCase(),
            modelo: document.getElementById('modelo').value,
            cliente: document.getElementById('cliente').value,
            whatsapp: document.getElementById('whatsapp').value,
            avarias: document.getElementById('avarias').value
        };

        try {
            const response = await fetch('http://localhost:8000/checkin', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify(dados)
            });
            const result = await response.json();
            
            document.getElementById('checkinForm').reset();
            document.getElementById('sucessoDiv').classList.remove('d-none');
            document.getElementById('ticketMsg').innerText = `Ticket #${result.ticket} gerado para o veículo ${result.placa}`;
        } catch (error) {
            alert('Erro ao conectar com a API LavaCheck.');
        }
    });
</script>
</body>
</html>
